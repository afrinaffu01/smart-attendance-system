<!DOCTYPE html>
<html>
<head>
<title>Attendance Records</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #eef2f3, #dfe9f3);
    margin:0;
}

.header{
    background:#4a90e2;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    letter-spacing:1px;
}

.container{
    width:95%;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* Table Design */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    overflow:hidden;
    border-radius:10px;
}

th{
    background:#4a90e2;
    color:white;
    padding:12px;
    text-transform:uppercase;
    font-size:14px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

/* Zebra effect */
tr:nth-child(even){
    background:#f9f9f9;
}

/* Hover effect */
tr:hover{
    background:#d6e4ff;
    transform:scale(1.01);
    transition:0.2s;
}

/* Status colors */
.present{
    color:green;
    font-weight:bold;
}

.late{
    color:orange;
    font-weight:bold;
}

.absent{
    color:red;
    font-weight:bold;
}

/* Button */

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.btn:hover{
    background:#2f6fc2;
}

</style>

</head>

<body>

<div class="header">
Attendance Records
</div>

<div class="container">

<div class="card">

<table>

<tr>
<th>Register No</th>
<th>Name</th>
<th>Department</th>
<th>DOB</th>
<th>Email</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
</tr>

{% for a in attendance %}

<tr>

<td>{{ a.RegisterNo_y }}</td>
<td>{{ a.Name }}</td>
<td>{{ a.Department }}</td>
<td>{{ a.DOB }}</td>
<td>{{ a.Email }}</td>
<td>{{ a.Date }}</td>
<td>{{ a.Time }}</td>

<td class="
{% if a.Status == 'Present' %}present
{% elif a.Status == 'Late' %}late
{% else %}absent
{% endif %}
">
{{ a.Status }}
</td>

</tr>

{% endfor %}

</table>

<a href="/dashboard" class="btn">⬅ Back to Dashboard</a>

</div>

</div>

</body>
</html>
